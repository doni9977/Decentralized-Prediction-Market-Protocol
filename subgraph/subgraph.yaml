specVersion: 0.0.5
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: MarketFactory
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: MarketFactory
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
      abis:
        - name: MarketFactory
          file: ./abis/MarketFactory.json
        - name: MinimalPredictionMarket
          file: ./abis/MinimalPredictionMarket.json
      eventHandlers:
        - event: MarketCreated(indexed bytes32,indexed address,indexed address)
          handler: handleMarketCreated
        - event: DeterministicMarketCreated(indexed bytes32,indexed address,indexed bytes32)
          handler: handleDeterministicMarketCreated
      file: ./src/market.ts
  - kind: ethereum/contract
    name: PredictionMarket
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: PredictionMarket
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Market
        - Trade
        - LiquidityEvent
      abis:
        - name: PredictionMarket
          file: ./abis/PredictionMarket.json
      eventHandlers:
        - event: LiquidityAdded(indexed bytes32,indexed address,uint256,uint256,uint256,uint256)
          handler: handleLiquidityAdded
        - event: LiquidityRemoved(indexed bytes32,indexed address,uint256,uint256,uint256,uint256)
          handler: handleLiquidityRemoved
        - event: OutcomePurchased(indexed bytes32,indexed address,indexed uint8,uint256,uint256,uint256,uint256,uint256)
          handler: handleOutcomePurchased
        - event: FeeUpdated(uint256,uint256)
          handler: handleFeeUpdated
      file: ./src/market.ts
  - kind: ethereum/contract
    name: ResolutionManager
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: ResolutionManager
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Resolution
      abis:
        - name: ResolutionManager
          file: ./abis/ResolutionManager.json
      eventHandlers:
        - event: MarketResolved(indexed bytes32,uint8,uint256)
          handler: handleMarketResolved
        - event: ResolutionFinalized(indexed bytes32,uint8)
          handler: handleResolutionFinalized
        - event: ResolutionDisputed(indexed bytes32,indexed address,string)
          handler: handleResolutionDisputed
        - event: ResolutionChanged(indexed bytes32,uint8,uint8)
          handler: handleResolutionChanged
        - event: ResolutionCancelled(indexed bytes32)
          handler: handleResolutionCancelled
      file: ./src/resolution.ts
  - kind: ethereum/contract
    name: PredictionGovernor
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: PredictionGovernor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Proposal
        - Vote
      abis:
        - name: PredictionGovernor
          file: ./abis/PredictionGovernor.json
      eventHandlers:
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
      file: ./src/governance.ts
  - kind: ethereum/contract
    name: GovernanceToken
    network: base-sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: GovernanceToken
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Delegation
        - VotingPowerChange
      abis:
        - name: GovernanceToken
          file: ./abis/GovernanceToken.json
      eventHandlers:
        - event: DelegateChanged(indexed address,indexed address,indexed address)
          handler: handleDelegateChanged
        - event: DelegateVotesChanged(indexed address,uint256,uint256)
          handler: handleDelegateVotesChanged
      file: ./src/governance.ts
